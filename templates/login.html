<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Money Diary - Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(255,255,255,0.85) 0%,
                    rgba(255,255,255,0) 25%
                ),

                radial-gradient(
                    circle at 90% 10%,
                    rgba(255,255,255,0.75) 0%,
                    rgba(255,255,255,0) 25%
                ),

                linear-gradient(
                    135deg,
                    #dff4ff 0%,
                    #d9eaff 25%,
                    #e9ddff 50%,
                    #f8dff0 75%,
                    #dcecff 100%
                );
        }


        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }


        .login-card {

            background: rgba(255,255,255,0.82);

            backdrop-filter: blur(15px);

            padding: 40px;

            border-radius: 24px;

            border: 1px solid rgba(255,255,255,0.8);

            box-shadow:
                0 15px 40px rgba(100,90,160,0.15);
        }


        .logo {

            text-align: center;

            font-size: 32px;

            font-weight: bold;

            color: #4a3f7a;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #777292;

            margin-bottom: 30px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 8px;

            color: #4b4569;
        }


        input {

            width: 100%;

            padding: 14px;

            border: 1px solid #d9d5e8;

            background: rgba(255,255,255,0.85);

            border-radius: 12px;

            font-size: 16px;

            outline: none;

            margin-bottom: 20px;

            color: #39334f;
        }


        input:focus {

            border-color: #8b82d8;

            box-shadow:
                0 0 0 3px rgba(139,130,216,0.12);
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #6f72d8,
                    #9b72d8
                );

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(105,100,190,0.25);

            transition: 0.2s;
        }


        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 23px rgba(105,100,190,0.32);
        }


        .register-text {

            text-align: center;

            margin-top: 25px;

            color: #777292;
        }


        .register-text a {

            color: #7567c9;

            font-weight: bold;

            text-decoration: none;
        }


        .register-text a:hover {

            text-decoration: underline;
        }


        @media (max-width: 500px) {

            .login-card {

                padding: 30px 25px;
            }


            .logo {

                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="logo">

            💰 Money Diary

        </div>


        <div class="subtitle">

            Welcome back! 👋

        </div>


        <form method="POST" action="/login">


            <label>

                Email

            </label>


            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>

                Password

            </label>


            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">

                Login ✨

            </button>


        </form>


        <div class="register-text">

            Don't have an account?

            <a href="/register">

                Create Account

            </a>

        </div>


    </div>


</div>


</body>

</html>
